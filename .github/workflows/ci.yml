name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff check
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy .

      - name: Pytest
        run: python -m pytest -q

      - name: Verify automatica (informatiu)
        run: python verify_automatica.py
        continue-on-error: true

      - name: Build check (dry-run spec validation)
        run: python -c "import pathlib; assert pathlib.Path('JMEJCat.spec').exists(), 'JMEJCat.spec missing'; print('spec OK')"
